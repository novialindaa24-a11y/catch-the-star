<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Catch The Star</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

<h1>🌟 Catch The Star 🌟</h1>

<div class="info">
    <p>⭐ Skor : <span id="score">0</span></p>
    <p>🎮 Level : <span id="level">1</span></p>
    <p>⏰ Waktu : <span id="timer">60</span></p>
</div>

<button id="startBtn">Mulai Game</button>

<div id="gameArea">
    <div id="player1" class="player"></div>
    <div id="player2" class="player"></div>
    <div id="enemy"></div>
    <div id="star"></div>
</div>

<h2 id="message"></h2>

<audio id="collectSound" src="audio/collect.mp3"></audio>
<audio id="winSound" src="audio/win.mp3"></audio>
<audio id="gameOverSound" src="audio/gameover.mp3"></audio>

<script src="script.js"></script>

</body>
</html>
