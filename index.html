<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Brick Breaker - SMKN 1 Sanden</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- === BAGIAN LOGO === -->
    <div class="logo-bar">
        <img src="LOGO SMK.jpeg" alt="SMKN 1 SANDEN BANTUL" class="logo-sekolah">
        <img src="LOGO OSIS.jpeg" alt="ONE SANDEN VOCATIONAL SCHOOL" class="logo-ov">
        <img src="LOGO RPL.jpeg" alt="JURUSAN RPL" class="logo-rpl">
        <img src="LOGO MOKO.jpeg" alt="MOKO GAME DEV" class="logo-moko">
    </div>

    <h1>🧱 Brick Breaker 🧱</h1>

    <div class="info">
        <div>🏆 Skor : <span id="score">0</span></div>
        <div>🎮 Level : <span id="level">1</span></div>
        <div>⏰ Waktu : <span id="timer">60</span></div>
    </div>

    <button id="startBtn">Mulai Game</button>

    <div id="gameContainer">
        <canvas id="gameCanvas" width="800" height="500"></canvas>
    </div>

    <div id="message"></div>

    <audio id="hitSound">
        <source src="audio/hit.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="winSound">
        <source src="audio/win.mp3" type="audio/mpeg">
    </audio>
    
    <audio id="loseSound">
        <source src="audio/lose.mp3" type="audio/mpeg">
    </audio>

    <script src="script.js"></script>
</body>
</html>
